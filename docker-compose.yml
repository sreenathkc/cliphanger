# Matches the quick-start example in README.md / docs/API.md. Build the
# image locally with `docker compose build` while there's no published
# GHCR tag yet — once one is published, replace `build: .` with
# `image: ghcr.io/OWNER/cliphanger:latest`.
#
# environment: must be a real mapping, not just comments — an
# `environment:` key with nothing but comments under it parses as YAML
# null, not an empty mapping, and Compose rejects that (confirmed
# 2026-08-22, a real deploy failure: "services.cliphanger.environment
# must be a mapping"). Other optional vars, uncomment if needed:
#
#     # API_KEY: "change-me"  — omit this and ClipHanger generates one
#     # on first run, shown once in the web UI (Setup page). Only set
#     # here for a known key on infra-as-code setups; see
#     # Store.SeedAPIKeyIfUnset for why it's not re-applied on restart.
#     #
#     # WORKERS: "3"  — unset defaults to Auto (picked from this
#     # host's CPU count, cmd/cliphanger/main.go); only set this for a
#     # different max-simultaneous-jobs cap, and even then it's just a
#     # one-time seed for a fresh install — change it anytime afterward
#     # from the Setup page's Concurrency section instead.
services:
  cliphanger:
    build: .
    environment:
      # Raised from the 300s default (2026-08-24, real failure on this
      # NAS: "ffmpeg clip extraction timed out before finishing" — MKV's
      # seek index isn't always positioned as conveniently for a remote
      # byte-range seek as MP4's is, and 5 minutes wasn't enough headroom
      # for a slow one over this LAN). See README.md's env var table.
      JOB_TIMEOUT_SECONDS: "900"
    # Host networking, not a bridge + port mapping (changed 2026-08-23,
    # a real live diagnosis, not a guess): under Docker's default bridge
    # network, ClipHanger's outbound requests to a media server on the
    # SAME LAN carry a Docker-internal source IP (e.g. 172.20.0.2), which
    # Plex doesn't recognize as local — it logged those requests as
    # "(WAN)" and fast-failed them with a 500, even though the exact same
    # URL from a real LAN IP succeeded. Host networking makes ClipHanger
    # share the host's own network stack, so it's indistinguishable from
    # any other process on the box (same IP the NAS itself uses) — no
    # media-server-side "trust this subnet" configuration needed. This
    # is Linux-only (fine for the self-hosted NAS/home-server target this
    # ships for) — Docker Desktop on Mac/Windows doesn't support it the
    # same way; use the commented `ports:` mapping there instead.
    network_mode: host
    # ports:
    #   - "8420:8420"
    volumes:
      - ./data:/data
    restart: unless-stopped
