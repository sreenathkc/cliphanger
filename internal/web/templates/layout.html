{{define "layout"}}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · ClipHanger</title>
<!-- favicon.io export bundle, served from RegisterStaticAssets at bare
     root paths regardless of this page living under /ui/ (2026-08-24) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#131110">
<style>
  :root {
    --ground: #131110; --surface: #1c1917; --sunk: #100e0d;
    --border: #302b26; --ink: #efeae2; --ink-soft: #a9a093; --ink-faint: #7a7166;
    --accent: #e8a94a; --accent-ink: #1a1410;
    --queued: #7a7166; --running: #5aa9e6; --done: #5fb87a; --failed: #e0574f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 24px;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  header .brand span { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav a {
    color: var(--ink-soft); text-decoration: none; padding: 6px 12px;
    border-radius: 8px; font-size: 14px;
  }
  nav a.active { background: var(--surface); color: var(--ink); }
  main { max-width: 880px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  p.lede { color: var(--ink-soft); margin: 0 0 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
  }
  .flash {
    background: rgba(232,169,74,.12); border: 1px solid rgba(232,169,74,.35);
    color: var(--accent); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: 14px;
  }
  .flash.error { background: rgba(224,87,79,.12); border-color: rgba(224,87,79,.35); color: var(--failed); }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%; background: var(--sunk); border: 1px solid var(--border);
    color: var(--ink); border-radius: 8px; padding: 9px 11px; font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button, .btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-block; text-decoration: none;
  }
  button.secondary, .btn.secondary {
    background: transparent; color: var(--ink); border: 1px solid var(--border);
  }
  button.danger, .btn.danger { background: transparent; color: var(--failed); border: 1px solid rgba(224,87,79,.4); }
  /* Bigger tap target (2026-08-24, per direct report — "make the copy
     api key button larger"): the old `padding: 0 12px` gave this
     button almost no vertical size at all (just the 15px line-height),
     well under any reasonable mobile tap-target size. */
  button.copy-btn { flex: 0 0 auto; padding: 12px 18px; font-size: 19px; line-height: 1; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 28px rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 1000; max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(224,87,79,.5); color: var(--failed); }
  button.secondary.selected { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .muted { color: var(--ink-faint); font-size: 13px; }
  .hint {
    background: var(--sunk); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0 4px; font-size: 13px; line-height: 1.55; color: var(--ink-soft);
  }
  .hint strong { color: var(--ink); }
  .hint code { color: var(--accent); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--ink-faint); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.queued { background: rgba(122,113,102,.2); color: var(--queued); }
  .pill.running { background: rgba(90,169,230,.15); color: var(--running); }
  .pill.done { background: rgba(95,184,122,.15); color: var(--done); }
  .pill.failed { background: rgba(224,87,79,.15); color: var(--failed); }
  form.inline { display: inline; }
  .keybox {
    display: flex; gap: 8px; align-items: center; background: var(--sunk);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">CLIP<span>HANGER</span></div>
  {{if not .HideNav}}
  <nav>
    <a href="/ui/setup" class="{{if eq .Nav "setup"}}active{{end}}">Setup</a>
    <a href="/ui/jobs" class="{{if eq .Nav "jobs"}}active{{end}}">Jobs</a>
    <a href="/ui/health" class="{{if eq .Nav "health"}}active{{end}}">Health</a>
    <a href="/ui/security" class="{{if eq .Nav "security"}}active{{end}}">Security</a>
  </nav>
  {{end}}
</header>
<main>
  {{if .Flash}}<div class="flash {{if .FlashError}}error{{end}}">{{.Flash}}</div>{{end}}
  {{.Content}}
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
  // Shared across every page (2026-08-22, moved here from setup.html
  // 2026-08-24 once jobs.html needed it too, see submitFormSecurely
  // below) — brief feedback for an action with nothing else to show
  // for it, targeting the #toast div right above.
  function showToast(message, isError) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // Submits a <form> via fetch() instead of a native browser POST
  // (2026-08-24, real report: "whenever I try to delete something on
  // cliphanger it asks... information you are about to send is not
  // secure" — Safari's insecure-form warning, tied to an actual HTML
  // form submission/navigation over HTTP, not to an arbitrary JS
  // network request). This service is deliberately plain HTTP on the
  // LAN, not TLS (docs/DECISIONS.md's "Web UI is open by default"
  // entry) — switching every action here off native <form> submission
  // sidesteps the warning without adding TLS this self-hosted tool was
  // never meant to need.
  //
  // `event.preventDefault()` has to run SYNCHRONOUSLY, before any
  // `await` — an async function's return value is a Promise, and
  // `onsubmit="return anAsyncFn(...)"` would hand the browser a
  // (truthy) Promise object instead of `false`, which does NOT
  // suppress the native submit. So this takes the event directly and
  // prevents it immediately; the actual fetch happens after, fire-and-
  // forget from the browser's perspective.
  //
  // `fetch()` follows redirects by default, and `response.url` reflects
  // the FINAL url after following one — every one of these forms'
  // handlers already responds with `redirectWithFlash(...)`, so this
  // reproduces the exact same "POST, then land wherever the redirect
  // points, showing its flash message" a native form submit already
  // gave, with zero server-side changes needed.
  function submitFormSecurely(event, form) {
    event.preventDefault();
    (async () => {
      const params = new URLSearchParams(new FormData(form));
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params,
        });
        window.location.href = response.url;
      } catch (err) {
        showToast('Request failed — check your connection and try again.', true);
      }
    })();
  }

  // Copy-to-clipboard for token/key fields — moved here 2026-08-25 once
  // security.html needed it for the API key box too, same pattern
  // showToast/submitFormSecurely already went through (see their own
  // comments). Originally added 2026-08-22, rebuilt 2026-08-24 per direct
  // report: "It didn't work when I tried from phone few times" — with
  // zero feedback either way. Root cause: `navigator.clipboard` needs a
  // secure context (HTTPS), and this UI is normally reached over plain
  // HTTP on the LAN (http://<nas-ip>:8420) — on iOS Safari that makes
  // `navigator.clipboard` simply undefined, so the old code threw
  // immediately and silently, no error shown, no fallback. Now: try the
  // modern API only when it's actually available, fall back to the old
  // execCommand('copy') technique (works over plain HTTP, still broadly
  // supported despite being deprecated) otherwise — and either way, show
  // a real toast so success/failure is never silent again.

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    // Off-screen, not display:none — iOS Safari won't select/copy an
    // element that isn't actually laid out.
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyField(elementId, btn) {
    const el = document.getElementById(elementId);
    // Works for both a real <input> (Plex/Jellyfin token fields) and a
    // plain <code> display element (the API key box, which isn't an
    // input at all) — 'value' only exists on the former.
    const text = 'value' in el ? el.value : el.textContent;
    if (!text) return;

    const onSuccess = () => {
      const original = btn.textContent;
      btn.textContent = '✓';
      setTimeout(() => { btn.textContent = original; }, 1200);
      showToast('Copied to clipboard');
    };
    const onFailure = () => showToast("Couldn't copy — select and copy the text manually.", true);

    if (window.isSecureContext && navigator.clipboard) {
      navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
        legacyCopy(text) ? onSuccess() : onFailure();
      });
    } else {
      legacyCopy(text) ? onSuccess() : onFailure();
    }
  }
</script>
</body>
</html>
{{end}}
